<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <script src="init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Médico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c7bb6;
            font-size: 20px;
            margin-bottom: 5px;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            text-align: left;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background-color: #2c7bb6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover { background-color: #1a5a8a; }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>🔐 Acceso Médico</h1>
        <p>Consultorio Pediátrico Online</p>

        <label>Usuario</label>
        <input type="text" id="usuario" placeholder="Ingresá tu usuario">

        <label>Contraseña</label>
        <input type="password" id="contrasena" placeholder="Ingresá tu contraseña">

        <button class="btn" id="btnIngresar">Ingresar</button>
        <p class="error" id="error">Usuario o contraseña incorrectos</p>
    </div>

    <script>
        document.getElementById("btnIngresar").addEventListener("click", function() {
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;

            if (usuario === "dra.VeroPrueba" && contrasena === "VeroPrueba") {
                window.location.href = "panel-medico.html";
            } else {
                document.getElementById("error").style.display = "block";
            }
        });
    </script>
</body>
</html>
