<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Médico</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tarjeta { background: white; border-radius: 20px; padding: 40px; max-width: 380px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2c7bb6; font-size: 20px; margin-bottom: 5px; }
        p { color: #888; font-size: 14px; margin-bottom: 25px; }
        label { display: block; text-align: left; color: #555; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background-color: #2c7bb6; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .btn:hover { background-color: #1a5a8a; }
        .error { color: red; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>🔐 Acceso Médico</h1>
        <p>Consultorio Pediátrico Online</p>
        <label>Usuario</label>
        <input type="text" id="usuario" placeholder="Ingresá tu usuario">
        <label>Contraseña</label>
        <input type="password" id="contrasena" placeholder="Ingresá tu contraseña">
        <button class="btn" id="btnIngresar">Ingresar</button>
        <p class="error" id="error">Usuario o contraseña incorrectos</p>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const app = initializeApp(CONFIG.firebase);
        const db  = getFirestore(app);

        const USUARIO_DEFAULT  = "dra.ranalli";
        const PASSWORD_DEFAULT = "FlaviaRanalli";

        async function intentarLogin() {
            const btn = document.getElementById("btnIngresar");
            btn.textContent = "Verificando...";
            btn.disabled = true;
            const usuario    = document.getElementById("usuario").value.trim();
            const contrasena = document.getElementById("contrasena").value;
            try {
                const snap = await getDoc(doc(db, "configuracion", "acceso"));
                const usuarioOK  = snap.exists() ? snap.data().usuario   : USUARIO_DEFAULT;
                const passwordOK = snap.exists() ? snap.data().password  : PASSWORD_DEFAULT;
                if (usuario === usuarioOK && contrasena === passwordOK) {
                    window.location.href = "panel-medico.html";
                } else {
                    document.getElementById("error").style.display = "block";
                    btn.textContent = "Ingresar";
                    btn.disabled = false;
                }
            } catch (e) {
                if (usuario === USUARIO_DEFAULT && contrasena === PASSWORD_DEFAULT) {
                    window.location.href = "panel-medico.html";
                } else {
                    document.getElementById("error").style.display = "block";
                    btn.textContent = "Ingresar";
                    btn.disabled = false;
                }
            }
        }

        document.getElementById("btnIngresar").addEventListener("click", intentarLogin);
        document.addEventListener("keydown", e => { if (e.key === "Enter") intentarLogin(); });
    </script>
</body>
</html>
