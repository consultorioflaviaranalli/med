<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Consultorio Online</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tarjeta { background: white; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 90%; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        .subtitulo { font-weight: 600; font-size: 17px; color: #2d3748; margin-bottom: 6px; }
        p { color: #666; margin-bottom: 30px; font-size: 14px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; color: white; text-decoration: none; font-weight: 600; transition: opacity .2s; }
        .btn:hover { opacity: .88; }
        .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
        .logo-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; overflow: hidden; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .loading-bar { height: 3px; background: #e2e8f0; border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
        .loading-bar-inner { height: 100%; width: 40%; border-radius: 2px; animation: slide 1s infinite; }
        @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="logo-wrap">
            <div class="logo-circle" id="logoCircle">P</div>
        </div>
        <div class="loading-bar" id="loadingBar">
            <div class="loading-bar-inner" id="loadingBarInner" style="background:#667eea;"></div>
        </div>
        <h1 id="titulo" style="color:#667eea;">Consultorio Online</h1>
        <div class="subtitulo" id="subtitulo"></div>
        <p>Turnos online · Consultas · Seguimiento</p>
        <a class="btn" id="btnReservar" href="reservar-turno.html" style="background:#667eea;">📅 Reservar turno</a>
        <a class="btn" id="btnTurno" href="mi-turno.html" style="background:#667eea;">👤 Ya tengo turno</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const app = initializeApp(CONFIG.firebase);
        const db = getFirestore(app);

        async function cargarDatos() {
            // Primero mostramos datos del config.js mientras carga
            aplicarDatos({
                titulo: CONFIG.titulo,
                apellido: CONFIG.nombre,
                nombre: "",
                especialidad: CONFIG.especialidad,
                colorPrimario: CONFIG.colorPrimario,
                logoIcono: CONFIG.logoIcono,
                nombreApp: CONFIG.nombreApp,
                logoBase64: ""
            });

            // Luego sobreescribimos con datos de Firestore
            try {
                const snap = await getDoc(doc(db, "config", "profesional"));
                if (snap.exists()) {
                    aplicarDatos(snap.data());
                }
            } catch(e) {
                console.log("Usando config.js como fallback:", e.message);
            }

            document.getElementById("loadingBar").style.display = "none";
        }

        function aplicarDatos(c) {
            const color = c.colorPrimario || "#667eea";
            const espec = c.especialidad || "Pediatría";
            const nombreCompleto = c.nombreCompleto || ((c.titulo||"") + " " + (c.apellido||"") + " " + (c.nombre||"")).trim();
            const appNombre = c.nombreApp || "Consultorio";
            const letra = c.logoIcono || "P";

            document.getElementById("pageTitle").textContent = appNombre + " — " + nombreCompleto;
            document.getElementById("titulo").textContent = "Consultorio " + espec + " Online";
            document.getElementById("titulo").style.color = color;
            document.getElementById("subtitulo").textContent = nombreCompleto;
            document.getElementById("btnReservar").style.background = color;
            document.getElementById("btnTurno").style.background = color;
            document.getElementById("loadingBarInner").style.background = color;

            const logo = document.getElementById("logoCircle");
            if (c.logoBase64) {
                logo.innerHTML = `<img src="${c.logoBase64}" alt="logo" />`;
            } else {
                logo.textContent = letra;
                logo.style.background = `linear-gradient(135deg, ${color}, #764ba2)`;
            }
        }

        cargarDatos();
    </script>
</body>
</html>
