<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Consultorio Online</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tarjeta { background: white; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 90%; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; color: white; text-decoration: none; }
        .btn:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1 id="titulo"></h1>
        <h2 id="subtitulo" style="color:#555; font-size:18px;"></h2>
        <p>Turnos online · Consultas · Seguimiento</p>
        <a class="btn" id="btnReservar" href="reservar-turno.html">📅 Reservar turno</a>
        <a class="btn" id="btnTurno" href="mi-turno.html">👤 Ya tengo turno</a>
    </div>
    <script>
        document.getElementById("pageTitle").textContent = "Consultorio " + CONFIG.especialidad + " - " + CONFIG.titulo + " " + CONFIG.nombre;
        document.getElementById("titulo").textContent = "Consultorio " + CONFIG.especialidad + " Online";
        document.getElementById("titulo").style.color = CONFIG.colorPrimario;
        document.getElementById("subtitulo").textContent = CONFIG.titulo + " " + CONFIG.nombre;
        document.getElementById("btnReservar").style.background = CONFIG.colorPrimario;
        document.getElementById("btnTurno").style.background = CONFIG.colorPrimario;
    </script>
</body>
</html>
